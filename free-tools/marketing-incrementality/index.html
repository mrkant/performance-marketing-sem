<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Incrementality Intelligence | Shashi Kant</title>
  <meta name="description" content="Measure online and offline marketing investments. Executive dashboard, experiment lab, channel effectiveness and budget planning — free browser-based tools for marketers and agencies.">
  <meta name="author" content="Shashi Kant">
  <link rel="canonical" href="https://shashikant.jp/free-tools/marketing-incrementality/">

  <meta property="og:title" content="Marketing Incrementality Intelligence | Shashi Kant">
  <meta property="og:description" content="360-degree marketing investment measurement — dashboard, experiments, channel intelligence and budget tools. Browser-based, no paid APIs.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shashikant.jp/free-tools/marketing-incrementality/">
  <meta property="og:site_name" content="Shashi Kant">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0b1220">

  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/mii-app.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Marketing Incrementality Intelligence",
    "url": "https://shashikant.jp/free-tools/marketing-incrementality/",
    "description": "Browser-based marketing investment measurement platform for online and offline channels.",
    "applicationCategory": "BusinessApplication",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Person", "name": "Shashi Kant", "url": "https://shashikant.jp/" }
  }
  </script>
</head>
<body class="mii-app">

  <div class="mii-sidebar-overlay" id="mii-sidebar-overlay" hidden></div>

  <div class="mii-shell">

    <!-- Sidebar -->
    <aside class="mii-sidebar" id="mii-sidebar" aria-label="Application navigation">
      <div class="mii-sidebar-brand">
        <span class="mii-brand-mark">MII</span>
        <div class="mii-brand-text">
          Incrementality
          <span>Intelligence</span>
        </div>
      </div>
      <nav class="mii-nav" id="mii-nav" aria-label="Modules"></nav>
      <div class="mii-sidebar-footer">
        <a href="/free-tools/">← Free Tools hub</a><br>
        <a href="/">Main site</a>
      </div>
    </aside>

    <!-- Main -->
    <div class="mii-main">
      <header class="mii-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button type="button" class="mii-menu-toggle" id="mii-menu-toggle" aria-label="Open menu">Menu</button>
          <h1 class="mii-topbar-title" id="mii-topbar-title">Executive Dashboard</h1>
        </div>
        <div class="mii-topbar-actions">
          <div class="mii-mode-toggle" role="group" aria-label="User mode">
            <button type="button" class="mii-mode-btn mii-active" data-mode="business">Business</button>
            <button type="button" class="mii-mode-btn" data-mode="professional">Professional</button>
          </div>
        </div>
      </header>

      <div class="mii-content" id="mii-content">
        <!-- Views injected by JS -->
        <div class="mii-view" id="mii-view-dashboard"></div>
      </div>
    </div>

  </div>

  <!-- Chart.js (MIT license, free CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script src="js/mii-data.js"></script>
  <script src="js/mii-dashboard.js"></script>
  <script src="js/mii-investments.js"></script>
  <script src="js/mii-incrementality.js"></script>
  <script src="js/mii-experiment-lab.js"></script>
  <script src="js/mii-channels.js"></script>
  <script src="js/mii-crosschannel.js"></script>
  <script src="js/mii-mmm.js"></script>
  <script src="js/mii-optimizer.js"></script>
  <script src="js/mii-reports.js"></script>
  <script src="js/mii-app.js"></script>
</body>
</html>
